<style>
:root{--bg:#090e15;--panel:#111a25;--line:#253140;--muted:#92a1b5;--text:#ecf2f8;--mint:#9df4cd;--purple:#b6a1ff;--orange:#ffbe86}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button{cursor:pointer;border:1px solid var(--line);border-radius:9px;background:#1a2634;color:var(--text);padding:11px 17px;transition:.2s}button:hover{border-color:var(--mint);transform:translateY(-1px)}button:disabled{opacity:.45;cursor:default;transform:none}.primary{background:var(--mint);color:#10251d;font-weight:700;border-color:var(--mint)}.purple{background:#2d2546;border-color:#67538e}.danger{border-color:#9c514c;color:#ffb0a0}a{color:var(--mint)}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}aside{border-right:1px solid var(--line);padding:32px 20px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:#0c121b}.brand{font-weight:900;letter-spacing:2px;font-size:19px}.brand b{color:var(--mint)}.caption{color:var(--muted);font-size:12px;letter-spacing:1px}.nav{display:grid;gap:9px;margin-top:42px}.nav button{text-align:left;background:transparent;border-color:transparent;color:var(--muted)}.nav button.active{color:var(--mint);background:#163028;border-color:#2b5144}.sidebarfoot{margin-top:auto;font-size:12px;color:var(--muted)}main{padding:30px 42px;max-width:1500px;width:100%;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:28px}.status{color:var(--mint);font:12px monospace}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 12px var(--mint);margin-right:7px}.view{animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(5px)}}h1{font-size:36px;line-height:1.25;letter-spacing:-1px;margin:12px 0 18px}h2{font-size:20px;margin:0 0 14px}h3{margin:0 0 8px;font-size:16px}p{margin:8px 0 18px}.muted{color:var(--muted)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;gap:18px}.cols{grid-template-columns:1.5fr 1fr}.stats{grid-template-columns:repeat(3,1fr);margin:22px 0}.card{border:1px solid var(--line);background:linear-gradient(135deg,#141e2a,#101721);padding:24px;border-radius:14px}.hero{position:relative;overflow:hidden;padding:34px;background:radial-gradient(ellipse at 85% 20%,#244d40 0,transparent 50%),linear-gradient(135deg,#142a25,#121a25)}.hero:after{content:'＋';position:absolute;right:65px;top:0;font:220px monospace;color:#9df4cd0a;transform:rotate(15deg);pointer-events:none}.eyebrow{color:var(--mint);font:12px monospace;letter-spacing:2px}.hero p{max-width:600px}.big{font:38px/1.4 monospace;font-weight:bold;color:var(--mint)}.bar{height:6px;background:#25313e;border-radius:5px;margin:12px 0;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint);border-radius:5px}.tag{display:inline-block;font-size:12px;padding:3px 9px;border:1px solid #354151;border-radius:5px;color:var(--muted);margin:3px 4px 3px 0}.mission{border-top:1px solid var(--line);padding:17px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}.mission:last-child{padding-bottom:0}.boss{background:radial-gradient(ellipse at top right,#413050,transparent 70%),#141824;border-color:#534065}.bossIcon{font-size:44px;color:var(--purple)}.skillgrid{grid-template-columns:repeat(5,1fr);position:relative;margin-top:30px}.skillgrid:before{content:'';height:1px;background:var(--line);position:absolute;top:-15px;left:10%;right:10%}.skill{position:relative;padding:20px 14px}.skill:before{content:'';height:15px;position:absolute;top:-16px;left:50%;border-left:1px solid var(--line)}.skillicon{color:var(--mint);font-size:26px;margin-bottom:15px}.node{width:100%;text-align:left;padding:10px;margin:7px 0;font-size:13px}.node.done{border-color:#4d8b6b;color:var(--mint)}textarea,input,select{color:var(--text);background:#0b121b;border:1px solid #344253;border-radius:8px;padding:12px}textarea{width:100%;min-height:180px;resize:vertical}label{display:block;color:var(--muted);font-size:13px;margin:13px 0 6px}.setup{grid-template-columns:repeat(3,1fr)}select{width:100%}.interviewer{display:flex;gap:16px;align-items:center}.avatar{width:56px;height:56px;display:grid;place-items:center;background:#283d37;color:var(--mint);font-size:27px;border:1px solid #48765f;border-radius:12px}.question{font-size:24px;line-height:1.6;margin:23px 0 12px}.english{color:var(--muted);font-size:15px}.timer{color:var(--orange);font:32px monospace}.feedback{margin-top:20px;border-color:#426d5c}.check{padding:9px 0;border-bottom:1px solid var(--line)}details{margin:15px 0;padding:15px;border:1px solid var(--line);border-radius:9px}summary{cursor:pointer;color:var(--mint)}.notice{padding:12px 16px;background:#18212c;border-left:3px solid var(--purple);color:var(--muted);font-size:13px;margin:16px 0}.empty{text-align:center;padding:50px 20px}.score{font:48px monospace;color:var(--mint)}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:12px 22px;border:1px solid #54846f;background:#183329;border-radius:10px;z-index:10;max-width:90%;box-shadow:0 10px 40px #0008}footer{margin-top:30px;color:var(--muted);font-size:12px}.jdresult{margin-top:20px}.actions{margin-top:18px}.number{font:12px monospace;color:var(--mint)}.notes{min-height:80px}.hidden{display:none!important}

</style></head><body><div class="app"><aside><div class="brand"><b>▥</b> FINANCE QUEST</div><div class="caption">甲方财务面试训练器 / MVP 01</div><nav class="nav" aria-label="主导航"><button data-view="home" class="active">◈ &nbsp; 作战指挥台</button><button data-view="skills">⌘ &nbsp; 财务技能树</button><button data-view="interview">▷ &nbsp; 模拟面试</button><button data-view="pressure">♛ &nbsp; CFO 压力测试</button><button data-view="weak">◎ &nbsp; 薄弱点档案</button><button data-view="jd">＋ &nbsp; JD 岗位定制</button></nav><div class="sidebarfoot"><span class="dot"></span>离线训练 · 本地存档<br>把“我知道”练成“我会说”。</div></aside><main><header><div class="caption" id="crumb">TRAINING TERMINAL / DASHBOARD</div><div class="row"><span class="tag" id="level">LV.01 财务冒险者</span><span class="status"><span class="dot"></span>READY TO LEVEL UP</span></div></header><div id="content"></div><footer>单文件离线 MVP · 文字回答和 JD 仅存本地；语音识别可能由浏览器联网处理 · 存档依赖浏览器本地存储<br>面试存活率是训练指数，并非真实录用概率。关键词反馈仅辅助复习，请结合参考答案自评。</footer></main></div><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const groups=[['Accounting','核算基础','▤',['会计','核算','月结','收入','凭证','发票','审计','对账','accounting']],['FP&A','规划与分析','⌁',['预算','预测','经营分析','variance','forecast','fp&a','利润','报表']],['Finance BP','业务伙伴','◇',['bp','业务','决策','商机','协同','business','成本控制']],['Working Capital / Cash','营运资本与现金','＄',['现金','回款','应收','应付','库存','dso','ar','ap','cash']],['Systems / Automation','数字化与流程','⌘',['excel','erp','rpa','自动化','主数据','系统','sop','流程','清洗','金蝶','用友']]];
const Q=[];
function add(g,t,cn,en,points,model,follow){Q.push({id:Q.length,g,t,cn,en,points:points.map(p=>({label:p[0],keys:p[1].split('|')})),model,follow})}
add(0,'三张表联动','赊销 100 元，成本 60 元，暂不考虑税。三张报表如何变化？','Walk me through the three statements for a credit sale of 100 with a cost of 60.',[['利润增加 40','40|利润|profit'],['应收增加 100','应收|receivable|ar'],['存货减少 60','存货|库存|inventory'],['经营现金流不变','现金流不变|现金不变|不产生现金|no cash|unchanged']],'利润表收入 +100、成本 +60，净利润 +40；资产负债表应收 +100、存货 −60、留存收益 +40，仍平衡。间接法现金流从净利润 +40 出发，减应收增加 100，加存货减少 60，经营现金流净变化为 0。','如果客户下月才付款，三张表又如何变化？');
add(0,'收入确认','客户预付了一年的服务费，可以当月一次性确认收入吗？','Can an annual service prepayment be recognized as revenue immediately?',[['识别履约义务','履约|obligation'],['依据控制权与履约进度','控制权|进度|over time'],['预收款形成合同负债','合同负债|递延|deferred|liability']],'不能仅凭收款确认收入。按 IFRS 15 先识别合同、履约义务、交易价格及其分摊，再在履约义务满足时确认。若是持续提供且符合时段确认条件的服务，应随履约进度确认；预收款先列合同负债。具体仍需审阅合同与适用准则。','你会检查合同的哪些条款来判断是否按时段确认？');
add(0,'AR / AP 对账','海外门店营业款与银行到账不一致，你如何排查？','How would you reconcile store sales with bank receipts?',[['统一期间与币种','期间|币种|currency|cutoff'],['核对手续费与退款','手续费|退款|fee|refund'],['排查未达款与差异','未达|差异|timing|difference'],['留痕跟进','留痕|跟进|责任|owner']],'先统一门店、日期、币种和汇率口径，将 POS/平台交易、应收子账、总账、银行流水分层勾稽。区分到账时差、手续费、退款、拒付、重复/漏记与汇兑差异；逐笔建立差异清单，明确责任人与处理时限，完成调整复核并保留证据。','AP 端如何防止重复付款？');
add(0,'月结 / 费用审核','月底有费用已发生但发票未到，你怎样确保月结完整？','How do you close the month when invoices have not arrived?',[['权责发生制与暂估','权责|暂估|计提|accrual'],['截止性检查','截止|cutoff|cut-off'],['核对与复核','核对|复核|reconcile'],['后续冲回与归档','冲回|归档|reverse']],'根据权责发生制，按合同、验收、服务期间等证据合理暂估，不把发票到达当作唯一确认依据。完成截止测试、AR/AP 与总账核对、银行对账和异常检查；经审批计提，后续发票到达时冲回或调整，避免重复确认，归档凭证与支持材料。税务处理应另按适用规则核实。','如何区分本月费用与预付下月费用？');
add(1,'年度预算','业务说“明年销售增长 30%”，你会如何搭建预算？','How would you build a budget for a 30% sales growth target?',[['业务驱动因素','驱动|销量|客单|driver|volume'],['成本费用与产能','成本|产能|cost|capacity'],['假设与情景','假设|情景|scenario|assumption'],['三表与现金约束','现金|三表|cash']],'先把目标拆成门店/渠道、销量、价格、转化率等业务驱动，验证历史基线、市场和产能。联动毛利、人员、营销、CapEx 与营运资本，形成利润和现金预算。与业务确认假设、负责人和时间表，设计基准/乐观/保守情景，检查资金约束。','你怎样 challenge 业务团队过于乐观的假设？');
add(1,'滚动预测','滚动预测与年度预算有什么区别？如何更新未来 12 个月预测？','How does a rolling forecast differ from an annual budget?',[['预算目标与预测最新判断','目标|最新|target|outlook'],['固定前瞻窗口','12|窗口|horizon'],['更新驱动因素','驱动|假设|driver'],['偏差与行动','偏差|行动|action']],'年度预算通常是既定年度目标和资源配置基线；滚动预测是基于最新信息更新未来表现，不应为掩盖偏差而重写预算。每月纳入实际、延展未来 12 个月窗口，更新销量、价格、费用及现金驱动，解释变化和风险，与业务共同制定行动。','如何避免滚动预测变成每月重做一次预算？');
add(1,'Variance analysis','预算销量 100 件、单价 10 元；实际销量 120 件、单价 9 元。收入差异怎么拆？','Decompose revenue variance: budget 100 units at 10; actual 120 at 9.',[['总差异 +80','80'],['销量差异 +200','200'],['价格差异 −120','120'],['说明分解口径','口径|预算价|实际量|method']],'预算收入 1,000，实际 1,080，总差异 +80。采用“销量按预算价、价格按实际量”口径：销量差异 (120−100)×10=+200；价格差异 (9−10)×120=−120。两者合计 +80。其他口径也可，但需说明交互项分配并保持一致。','收入增长是否意味着毛利也增长？你还需要哪些数据？');
add(1,'经营分析','营收增长 20%，利润却下降，你如何写经营分析？','Revenue grew 20% but profit declined. How would you investigate?',[['毛利与产品结构','毛利|结构|mix|margin'],['价格成本量拆解','价格|成本|price|cost'],['费用及一次性事项','费用|一次性|opex|one-off'],['行动责任与指标','行动|责任|指标|action|owner']],'先校验数据口径，搭建收入到利润的桥接，区分价格、销量、产品/渠道结构、单位成本、折扣和退货。再分析人员、营销、租金及一次性项目。按业务单元定位问题，以影响金额排序，提出可执行建议、责任人和监测 KPI，而不止描述涨跌。','管理层只有一分钟，你会怎样表达结论？');
add(2,'Business partnering','销售希望打九折冲量，你怎样支持并挑战这项决策？','How would you support and challenge a proposed 10% discount?',[['明确业务目标','目标|objective'],['贡献毛利与增量','贡献|增量|contribution|incremental'],['情景和风险','情景|风险|scenario|risk'],['试点与追踪','试点|追踪|pilot|kpi']],'先理解销售目标和客户需求，基于单件贡献毛利计算所需增量：盈亏平衡销量倍数=原单位贡献/折后单位贡献（需为正），并考虑产能与营销投入。检查回款、蚕食和品牌风险，做敏感性分析；与销售共同设定试点、退出条件、责任人和 KPI。','如果业务不接受你的建议，你怎么推动双方达成一致？');
add(2,'业财沟通','业务觉得财务只会说“不”，你如何建立合作？','How do you build trust when business teams see finance as a blocker?',[['理解业务与共同目标','理解|共同|目标|understand'],['数据与备选方案','数据|方案|option|data'],['协同决策','协同|沟通|stakeholder'],['跟进效果','跟进|复盘|result']],'先走进业务现场，理解流程与共同目标。用数据说明限制和风险，同时提供可行备选方案，区分硬性控制与可协商取舍。约定决策机制、负责人、里程碑和衡量指标；实施后复盘，用可靠的数据与及时支持建立信任。用真实经历按 STAR 结构说明。','请给一个你推动业务改善的具体例子，说明你的个人贡献。');
add(3,'现金流 / CFO 核心','Revenue 增长 20%，Operating Cash Flow 却下降，可能是什么原因？','Why could operating cash flow fall while revenue grows 20%?',[['应收增加','应收|ar|receivable'],['库存增加','库存|存货|inventory'],['应付支付节奏','应付|ap|payable'],['利润与非现金项目','利润|非现金|税|non-cash|tax']],'收入不等于现金。先从净利润到 OCF 做桥接：回款滞后导致应收增加、备货导致库存增加、提前支付供应商导致应付减少，均可能占用现金；再检查利润率、税款及非现金调整。结合账龄、DSO、库存周转、付款节奏与季节性验证，再提出回款和库存行动。','如果 EBITDA 很好，公司为什么仍然可能资金链断裂？');
add(3,'DSO / AR aging','平均应收 300 万、全年赊销收入 3,600 万，DSO 大约是多少？','Estimate DSO with average receivables of 3m and annual credit sales of 36m.',[['约 30.4 天','30|30.4'],['公式及匹配口径','365|公式|formula'],['账龄与逾期分析','账龄|逾期|aging'],['改善回款','回款|催收|collect']],'按 365 天：DSO=平均应收账款/同期赊销收入×365≈30.4 天。应收与收入的税口径、期间和币种应匹配，分母最好用赊销；销售季节性可能影响解释。结合账龄、逾期、客户集中度与信用条款，推动争议处理、开票准确和分层催收。','DSO 下降一定代表催收改善吗？');
add(3,'Working capital','如何缩短 Cash Conversion Cycle，而不损害业务？','How would you shorten the cash conversion cycle?',[['CCC = DSO + DIO − DPO','dso|dio|dpo|公式'],['回款及库存优化','回款|库存|inventory'],['付款条款协商','条款|协商|terms'],['供应链与风险','供应|风险|risk']],'CCC=DSO+DIO−DPO。通过信用管理、及时开票和催收缩短 DSO；通过需求预测和滞销治理降低 DIO；与供应商协商合理账期改善 DPO。权衡缺货、折扣损失、关系与供应链风险，不能简单延迟所有付款。按客户/产品分层跟踪现金改善。','库存减少会怎样影响现金、利润和服务水平？');
add(4,'Excel / 数据清洗','电商平台数据和 ERP 对不上，怎样用 Excel 排查？','How would you reconcile e-commerce data with ERP using Excel?',[['统一主键与口径','主键|口径|key'],['清洗与去重','清洗|去重|clean|duplicate'],['关联汇总','xlookup|sumifs|power query|透视'],['控制总额与异常','总额|异常|control|exception']],'确定订单/交易主键与结算周期，统一日期、币种、金额符号及状态。用 Power Query 清洗、去重并记录转换，用 XLOOKUP/合并查询关联明细，用 SUMIFS/透视表分渠道汇总。设置行数、控制总额与差异清单，检查一对多、退款与手续费，复核后输出可追溯报表。','XLOOKUP 匹配到一条记录，为什么仍可能漏掉问题？');

let state={history:[],weak:{},jd:'',target:[],xp:0};let storage=true;try{const raw=JSON.parse(localStorage.getItem('financeQuest-v1')||'null');if(raw&&Array.isArray(raw.history)&&raw.weak&&typeof raw.weak==='object')state={...state,...raw}}catch(e){storage=false}
let view='home',session=null,ticker=null;const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function mastery(g){const list=Q.filter(q=>q.g===g);return Math.round(list.reduce((a,q)=>a+Math.max(0,...state.history.filter(h=>h.id===q.id).map(h=>h.score)),0)/list.length)}
function nav(v){if(session&&session.active&&v!==view){toast('请先结束当前训练，再切换页面');return}view=v;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#crumb').textContent='TRAINING TERMINAL / '+({home:'DASHBOARD',skills:'SKILL TREE',interview:'INTERVIEW',pressure:'BOSS ROOM',weak:'DEBRIEF',jd:'JOB MATCH'}[v]);$('#level').textContent='LV.'+String(1+Math.floor(state.xp/100)).padStart(2,'0')+' 财务冒险者';render();window.scrollTo(0,0)}

function home(){let avg=Math.round(groups.reduce((a,_,g)=>a+mastery(g),0)/5),today=state.history.filter(h=>h.day===new Date().toLocaleDateString()).length;return `<div class="hero card"><div class="eyebrow">MISSION 01 / 从会算，到会回答</div><h1>下一场面试，<br>带着底气进入会议室。</h1><p class="muted">练财务逻辑，也练业务表达。五条技能路线、真实岗位场景、层层追问——你的财务冒险从这里开始。</p><div class="row"><button class="primary" onclick="nav('interview')">开始模拟面试 →</button><button onclick="nav('jd')">导入我的目标 JD</button></div></div><div class="grid stats"><div class="card"><div class="caption">面试存活率 · 训练指数</div><div class="big">${state.history.length?avg+'%':'待测'}</div><div class="muted">五路线掌握度平均值</div></div><div class="card"><div class="caption">技能掌握</div><div class="big">${Q.filter(q=>state.history.some(h=>h.id===q.id&&h.score>=75)).length}<small style="font-size:16px;color:var(--muted)"> / ${Q.length}</small></div><div class="muted">自评 ≥75 分点亮技能</div></div><div class="card"><div class="caption">今日训练</div><div class="big">${today}<small style="font-size:16px;color:var(--muted)"> / 3</small></div><div class="muted">${today>=3?'今日任务完成，继续挑战！':'完成三次复盘，建立回答肌肉记忆'}</div></div></div><div class="grid cols"><div class="card"><div class="row between"><h2>今日任务</h2><span class="number">DAILY QUESTS</span></div><div class="mission"><div><h3>01 / 基础不能掉线</h3><span class="muted">三张表、收入确认、月结</span></div><button onclick="start('normal',0)">练基础 ↗</button></div><div class="mission"><div><h3>02 / 把数字翻译成业务</h3><span class="muted">预算、差异、经营建议</span></div><button onclick="start('normal',1)">练分析 ↗</button></div><div class="mission"><div><h3>03 / 修复知识盲区</h3><span class="muted">${Object.keys(state.weak).length} 个待攻克薄弱点</span></div><button onclick="nav('weak')">去复习 ↗</button></div></div><div class="card boss"><div class="row between"><span class="tag">BOSS CHALLENGE</span><span class="bossIcon">♛</span></div><h2>CFO Pressure Test</h2><p class="muted">120 秒。一个现金流场景，三轮追问。把“我还想想”变成结构清晰的判断。</p><div class="row"><span class="timer">02:00</span><button class="purple" onclick="nav('pressure')">进入 CFO 房间 →</button></div></div></div><div class="card" style="margin-top:18px"><h2>你的能力雷达</h2><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${groups.map((g,i)=>`<div><span class="muted">${g[0]}</span><div class="bar"><i style="width:${mastery(i)}%"></i></div><span class="number">${mastery(i)}% 已掌握</span></div>`).join('')}</div></div>`}
function skills(){return `<div class="eyebrow">CHOOSE YOUR PATH</div><h1>点亮技能，解锁底气。</h1><p class="muted">每个节点都能直接训练。复盘自评达到 75 分点亮；五条路线都达到 60% 获得 CFO 徽章。</p><div class="card boss" style="text-align:center"><span class="bossIcon">♛</span><h2>CFO ROOM</h2><span class="tag">${groups.every((_,i)=>mastery(i)>=60)?'✦ 综合能力徽章已解锁':'五路线 ≥60% 解锁综合能力徽章'}</span><button onclick="nav('pressure')">挑战 CFO</button></div><div class="grid skillgrid">${groups.map((g,i)=>`<div class="card skill"><div class="skillicon">${g[2]}</div><h3>${g[0]}</h3><div class="muted">${g[1]}</div><div class="bar"><i style="width:${mastery(i)}%"></i></div>${Q.filter(q=>q.g===i).map(q=>`<button class="node ${state.history.some(h=>h.id===q.id&&h.score>=75)?'done':''}" onclick="start('normal',${i},${q.id})">${state.history.some(h=>h.id===q.id&&h.score>=75)?'✦':'◇'} ${q.t}</button>`).join('')}</div>`).join('')}</div>`}
function room(pressure){if(session)return sessionMarkup();return `<div class="eyebrow">${pressure?'BOSS ROOM / 120 SECONDS':'INTERVIEW SIMULATION'}</div><h1>${pressure?'面对 CFO，稳住你的逻辑。':'准备好，面试官在等你。'}</h1><div class="grid cols"><div class="card ${pressure?'boss':''}"><div class="interviewer"><div class="avatar">${pressure?'♛':'◈'}</div><div><h3>${pressure?'CFO · 现金流压力测试':'Finance Director · 情景面试'}</h3><span class="muted">${pressure?'三轮连续追问，倒计时不会暂停':'一场三题 · 每题一轮追问 · 支持语音转文字'}</span></div></div>${pressure?'<p style="margin-top:25px">首问：为什么营收在增长，经营现金流却下降？<br><span class="muted">接着：为什么 EBITDA 好，公司仍可能资金链断裂？<br>最后：怎样从报表和业务数据验证判断？</span></p>':`<div class="grid setup"><div><label for="route">目标岗位</label><select id="route"><option value="all">综合甲方财务</option>${groups.map((g,i)=>`<option value="${i}">${g[0]}</option>`).join('')}<option value="jd" ${state.target.length?'':'disabled'}>我的 JD 定制路线</option></select></div><div><label for="difficulty">面试深度</label><select id="difficulty"><option value="manager">Hiring Manager</option><option value="director">Finance Director</option></select></div><div><label for="language">提问语言</label><select id="language"><option value="both">中文 + English</option><option value="en">English 优先</option></select></div></div>`}<div class="actions"><button class="primary" onclick="start('${pressure?'pressure':'normal'}')">${pressure?'开始 120 秒挑战 →':'进入会议室 →'}</button></div></div><div class="card"><h2>回答装备</h2><p>① 先给结论<br>② 拆解驱动和因果<br>③ 用数据验证<br>④ 给出行动与风险</p><div class="notice">这是离线练习：面试官追问来自内置题库，反馈使用关键词覆盖检查。参考答案可帮助你检查逻辑，再自行判断掌握程度。</div><span class="tag">不需要 API Key</span><span class="tag">进度本地保存</span></div></div>`}
function start(mode,g,id){if(session?.active)return;clearInterval(ticker);let r=g===undefined?$('#route')?.value:g;let pool=r==='jd'?Q.filter(q=>state.target.includes(q.g)):r===undefined||r==='all'?Q:Q.filter(q=>q.g===Number(r));if(!pool.length)pool=Q;const sorted=[...pool].sort((a,b)=>(state.history.filter(h=>h.id===a.id).length-state.history.filter(h=>h.id===b.id).length)||a.id-b.id);session={mode,active:true,queue:mode==='pressure'?[10]:id!==undefined?[id]:sorted.slice(0,3).map(q=>q.id),index:0,stage:0,answers:[],results:[],remaining:120,lang:$('#language')?.value||'both',difficulty:$('#difficulty')?.value||'manager'};view=mode==='pressure'?'pressure':'interview';nav(view);if(mode==='pressure'){session.end=Date.now()+120000;ticker=setInterval(()=>{if(!session?.active)return;session.remaining=Math.max(0,Math.ceil((session.end-Date.now())/1000));const el=$('#clock');if(el)el.textContent=formatTime(session.remaining);if(!session.remaining)finishAnswer(true)},250)}}
function formatTime(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function sessionMarkup(){if(!session.active)return feedbackMarkup();let q=Q[session.queue[session.index]],stage=session.stage;let cn=stage===0?q.cn:session.mode==='pressure'?(stage===1?'EBITDA 很好，公司为什么仍然可能资金链断裂？请举例。':'你会从哪些报表和业务指标验证风险？会建议什么行动？'):q.follow;let en=stage===0?q.en:session.mode==='pressure'?(stage===1?'Why can a company with strong EBITDA still run out of cash? Give an example.':'How would you verify the risks and recommend actions?'):'Explain your reasoning with a concrete example and evidence.';return `<div class="row between"><div><div class="eyebrow">${session.mode==='pressure'?'CFO PRESSURE TEST':'LIVE INTERVIEW'}</div><h1 style="font-size:28px">${q.t}</h1></div>${session.mode==='pressure'?`<span class="timer" id="clock">${formatTime(session.remaining)}</span>`:`<span class="tag">题目 ${session.index+1}/${session.queue.length} · ${stage?'追问':'主问'}</span>`}</div><div class="card"><div class="interviewer"><div class="avatar">${session.mode==='pressure'?'♛':'◈'}</div><div><h3>${session.mode==='pressure'?'CFO':session.difficulty==='director'?'Finance Director':'Hiring Manager'}</h3><span class="number">${stage?'FOLLOW-UP / 深挖你的逻辑':'YOUR TURN / 清晰表达你的判断'}</span></div></div><div class="question">${session.lang==='en'?en:cn}</div><p class="english">${session.lang==='en'?cn:en}</p>${session.answers.length?`<details><summary>查看前面的回答</summary>${session.answers.map(a=>`<p>${esc(a)}</p>`).join('')}</details>`:''}<label for="answer">你的回答（中文 / English 均可）</label>${voiceMarkup()}<textarea id="answer" placeholder="我会先……因为……我会用……验证，建议……"></textarea><div id="speechinterim" class="notice hidden" aria-live="polite"></div><div class="row actions"><button class="primary" onclick="advance()">${session.mode==='pressure'?(stage<2?'回答并接受追问 →':'提交挑战复盘 →'):stage===0?'回答并接受追问 →':'提交本题复盘 →'}</button><button onclick="hint()">给我一点提示</button><button class="danger" onclick="finishAnswer(true)">结束并复盘</button></div><div id="hint" class="notice hidden"></div></div>`}
function hint(){$('#hint').textContent='思考方向：'+Q[session.queue[session.index]].points.map(p=>p.label).join(' → ');$('#hint').classList.remove('hidden')}
function advance(){if(voice){toast('请先停止语音，等待转写完成后再提交');return}const a=$('#answer').value.trim();if(a.length<6){toast('请至少写一句完整的回答，再进入下一步');return}session.answers.push(a);const max=session.mode==='pressure'?2:1;if(session.stage<max){session.stage++;render();$('#answer').focus()}else finishAnswer(false,true)}
function finishAnswer(end,pushed=false){if(!session?.active)return;stopVoice(true);if(!pushed){const a=$('#answer')?.value.trim();if(a)session.answers.push(a)}clearInterval(ticker);session.active=false;session.ended=end;let q=Q[session.queue[session.index]],text=session.answers.join('\n'),hit=q.points.map(p=>p.keys.some(k=>text.toLowerCase().includes(k.toLowerCase())));session.feedback={q,hit,suggested:Math.round(hit.filter(Boolean).length/hit.length*100),text};render()}
function feedbackMarkup(){const f=session.feedback;if(session.saved)return summaryMarkup();return `<div class="eyebrow">INTERVIEW DEBRIEF / 复盘才是升级</div><h1>${session.mode==='pressure'?'压力挑战结束。':'这一题，你已经走了一遍。'}</h1><div class="grid cols"><div class="card feedback"><div class="row between"><h2>关键词覆盖检查</h2><div class="score">${f.suggested}<small style="font-size:14px"> /100</small></div></div><div class="notice">匹配到关键词不代表推理正确，未匹配也不代表你没答到。请对照下面的要点和参考回答，自评后再存档。</div>${f.q.points.map((p,i)=>`<div class="check">${f.hit[i]?'✓':'○'} ${p.label} <span class="muted">· ${f.hit[i]?'检测到关键词':'请自行检查是否覆盖'}</span></div>`).join('')}<details open><summary>更清晰的参考回答</summary><p>${f.q.model}</p>${session.mode==='pressure'?'<p>追加回答：EBITDA 不反映营运资本占用、资本开支、债务本金偿还等全部现金需求。即使盈利指标好，回款拖延、备货或集中还债仍可能消耗流动性。用净利润到 OCF 桥接、现金余额、账龄、库存周转、CapEx 与债务到期表验证；建立短期现金预测并安排回款、库存和融资行动。</p>':''}</details>${expressionMarkup(f.text)}<details><summary>回看我的回答</summary><p style="white-space:pre-wrap">${esc(f.text||'本次没有提交回答。')}</p></details></div><div class="card"><h2>你觉得掌握了吗？</h2><p class="muted">根据准确性、结构和行动建议自评。存档后更新技能树与薄弱点。</p><label for="selfscore">掌握程度</label><select id="selfscore"><option value="25">25 · 还没建立逻辑</option><option value="50" selected>50 · 理解了，表达还需练习</option><option value="75">75 · 主要逻辑完整，仍需补充</option><option value="100">100 · 可独立清晰作答</option></select><label for="note">复习笔记（选填）</label><textarea class="notes" id="note" placeholder="下次要补充的数据、容易混淆的概念……"></textarea><button class="primary actions" onclick="record()">保存复盘 · 获得 XP →</button></div></div>`}
function record(){if(session.saved)return;const f=session.feedback,score=Number($('#selfscore').value),note=$('#note').value.trim();state.history.push({id:f.q.id,score,day:new Date().toLocaleDateString(),time:Date.now(),mode:session.mode,note,answer:f.text,voiceTurns:session.voiceTurns||[]});state.xp+=Math.round(score/5)+10;if(score<75)state.weak[f.q.id]={note,score};else delete state.weak[f.q.id];session.results.push({id:f.q.id,score});session.saved=true;save();render();toast('复盘已保存，技能进度已更新')}
function summaryMarkup(){const final=session.ended||session.index===session.queue.length-1;return `<div class="card empty"><div class="bossIcon">${session.results.at(-1).score>=75?'✦':'◇'}</div><h1>${final?'训练完成，经验已入账。':'本题复盘已保存。'}</h1><p class="muted">${session.results.map(r=>`${Q[r.id].t} · 自评 ${r.score} 分`).join('<br>')}</p><div class="row" style="justify-content:center">${!final?'<button class="primary" onclick="nextQuestion()">继续下一题 →</button>':''}<button onclick="leave('home')">回指挥台</button><button onclick="leave('weak')">查看薄弱点</button></div></div>`}
function nextQuestion(){session.index++;session.stage=0;session.answers=[];session.voiceTurns=[];session.active=true;session.saved=false;render()}
function leave(v){stopVoice(true);clearInterval(ticker);session=null;nav(v)}
function weak(){const list=Object.keys(state.weak).map(Number).filter(id=>Q[id]);return `<div class="eyebrow">KNOWLEDGE RECOVERY</div><h1>把薄弱点，变成加分项。</h1><p class="muted">自评低于 75 分自动记录；再次训练达到 75 分后移出待复习。</p>${list.length?`<div class="grid">${list.map(id=>`<div class="card"><div class="row between"><div><span class="tag">${groups[Q[id].g][0]}</span><h2>${Q[id].t}</h2></div><button class="primary" onclick="start('normal',${Q[id].g},${id})">再次挑战 →</button></div><p>${Q[id].cn}</p><p class="muted">${esc(state.weak[id].note||'复习建议：用“结论 → 原因 → 验证 → 行动”重新组织答案。')}</p><details><summary>查看知识补漏</summary><p>${Q[id].model}</p></details></div>`).join('')}</div>`:'<div class="card empty"><div class="bossIcon">◎</div><h2>目前没有待复习的薄弱点</h2><p class="muted">完成训练并保存自评后，这里会形成你的专属复习档案。</p><button class="primary" onclick="nav(\'interview\')">去做一次模拟面试</button></div>'}<div class="card" style="margin-top:20px"><h2>最近训练</h2>${state.history.slice(-8).reverse().map(h=>`<div class="mission"><span>${Q[h.id]?.t||'题目'}<br><span class="caption">${esc(h.day)} · ${h.mode==='pressure'?'CFO 挑战':'模拟面试'}</span></span><span class="number">${h.score} 分</span></div>`).join('')||'<p class="muted">还没有训练记录。</p>'}</div>`}
function jd(){return `<div class="eyebrow">JOB-SPECIFIC QUEST</div><h1>拿你的目标岗位，定制下一关。</h1><p class="muted">从 JD 职责识别训练路线，在内置题库里优先安排相关场景。</p><div class="grid cols"><div class="card"><div class="row between"><h2>粘贴或上传 JD</h2><button onclick="sampleJD()">填入示例</button></div><label for="jdtext">岗位职责与任职要求</label><textarea id="jdtext" placeholder="例如：参与滚动预算与预测、分析库存和资金效率、搭建经营分析模型、推动财务信息化……">${esc(state.jd)}</textarea><label for="jdfile">上传文本文件（.txt / .md，最大 1MB）</label><input id="jdfile" type="file" accept=".txt,.md,text/plain,text/markdown" onchange="readJD(this)"><p class="caption">前端演示只解析文本，不支持截图 OCR、PDF 或 Word。截图内容可手动粘贴。文件仅在本地读取。</p><button class="primary" onclick="analyzeJD()">识别重点 · 生成训练路线 →</button><div id="jdresult" class="jdresult" aria-live="polite"></div></div><div class="card"><h2>来自你的真实 JD 场景</h2><div class="mission"><div><h3>电商 / RPA</h3><span class="muted">台账核对、批量清洗、异常排查、运维交付</span></div></div><div class="mission"><div><h3>海外 / Finance BP</h3><span class="muted">AR/AP、营业款对账、租金台账、英文表达</span></div></div><div class="mission"><div><h3>财务管理 / FP&A</h3><span class="muted">年度预算、滚动利润预测、管理报告</span></div></div><div class="mission"><div><h3>财务数字化</h3><span class="muted">主数据维护、ERP、需求沟通与 SOP</span></div></div><div class="notice">识别依据：中英文关键词匹配，不能理解完整岗位语义。你可以勾选调整路线，再开始训练。</div></div></div><details><summary>知识依据与扩展阅读</summary><p>题型结合可取回的 10 张 JD 截图与原对话摘要，补充通用企业财务情景。</p><p><a target="_blank" rel="noopener" href="https://www.financialprofessionals.org/glossary/financial-planning-and-analysis">AFP：FP&A 的预算、预测、分析与决策支持</a><br><a target="_blank" rel="noopener" href="https://fpacert.financialprofessionals.org/exam/specifications">AFP：能力框架与 business partnering</a><br><a target="_blank" rel="noopener" href="https://www.ifrs.org/issued-standards/list-of-standards/ifrs-15-revenue-from-contracts-with-customers/">IFRS 15：收入确认五步法</a></p><p class="muted">知识核实日期：2026-09-30。收入确认示例采用 IFRS 15 框架；实际岗位需结合企业采用的会计准则、合同及政策。</p></details>`}
function sampleJD(){$('#jdtext').value='财务 BP：参与年度预算、滚动预测和经营分析，支持业务决策；挖掘库存、应收回款和资金效率机会。使用 Excel 和 ERP 整合数据，优化 SOP，参与 RPA 自动化项目。要求英文沟通与 business partnering 能力。'}
async function readJD(input){const f=input.files[0];if(!f)return;if(f.size>1048576||!(/\.(txt|md)$/i.test(f.name))){toast('请上传 1MB 以内的 .txt 或 .md 文件');input.value='';return}try{$('#jdtext').value=await f.text();toast('文本已读取，请识别训练重点')}catch(e){toast('文件读取失败，请直接粘贴 JD')}}
function analyzeJD(){const text=$('#jdtext').value.trim();if(text.length<10){toast('请先粘贴岗位职责与要求（至少 10 个字）');return}state.jd=text;let low=text.toLowerCase();state.target=groups.map((g,i)=>({i,hits:g[3].filter(k=>low.includes(k))})).filter(r=>r.hits.length);const matches=state.target;state.target=matches.map(m=>m.i);save();$('#jdresult').innerHTML=`<h3>${matches.length?'找到 '+matches.length+' 条训练路线':'没有识别到明确关键词，请手动选择路线'}</h3>${groups.map((g,i)=>`<label><input type="checkbox" name="jdroute" value="${i}" ${state.target.includes(i)?'checked':''}> ${g[0]} <span class="caption">${esc(matches.find(m=>m.i===i)?.hits.join(' / ')||'可手动添加')}</span></label>`).join('')}<button class="primary actions" onclick="trainJD()">按选中路线开始训练 →</button>`}
function trainJD(){const selected=[...document.querySelectorAll('[name=jdroute]:checked')].map(el=>Number(el.value));if(!selected.length){toast('请至少选择一条训练路线');return}state.target=selected;save();start('normal','jd')}

let voice=null;
function voiceMarkup(){const supported=!!(window.SpeechRecognition||window.webkitSpeechRecognition);return `<div class="card" style="padding:14px;margin-bottom:12px;background:#13251f"><div class="row"><button id="voicebutton" type="button" class="primary" onclick="toggleVoice()" ${supported?'':'disabled'}>🎙 开始语音回答</button><select id="voicelang" aria-label="语音识别语言" style="width:auto"><option value="zh-CN">普通话</option><option value="en-US" ${session.lang==='en'?'selected':''}>English</option></select><span id="voicestatus" role="status" class="caption">${supported?'点击后允许麦克风访问':'当前浏览器未提供语音识别接口'}</span></div><p class="caption" style="margin:10px 0 0">${supported?'边说边转写，也可随时打字修改或补充。新的语音片段追加到回答末尾，不覆盖手动编辑；待确认文字显示在下方。':'可在支持 Web Speech API 的外部浏览器中尝试，或使用系统/手机键盘的语音听写。'}<br>浏览器语音服务可能需要联网并将音频发送给其服务商；本网页不保存录音。若本地文件被阻止，请通过 localhost / HTTPS 打开。识别可能省略口癖或误识别财务术语，请核对原意。</p></div>`}
function voiceStatus(t){const e=$('#voicestatus');if(e)e.textContent=t}
function appendVoiceText(box,text){if(!text.trim())return;const start=box.selectionStart,end=box.selectionEnd,scroll=box.scrollTop;box.value+=(box.value&&!/\s$/.test(box.value)?'\n':'')+text.trim();if(typeof start==='number'&&typeof box.setSelectionRange==='function')box.setSelectionRange(start,end);box.scrollTop=scroll}
function toggleVoice(){if(voice){stopVoice(false);return}const API=window.SpeechRecognition||window.webkitSpeechRecognition;if(!API){toast('当前浏览器不支持语音识别，请尝试外部浏览器或系统听写');return}const box=$('#answer'),rec=new API(),v={rec,box,committed:new Set(),final:'',interim:'',started:Date.now(),stopping:false,error:false,closed:false};voice=v;rec.lang=$('#voicelang').value;rec.continuous=true;rec.interimResults=true;box.readOnly=false;$('#voicelang').disabled=true;$('#voicebutton').textContent='■ 停止语音';voiceStatus('正在请求麦克风权限…');
rec.onstart=()=>{if(voice===v)voiceStatus('● 正在听，也可同时打字修改；新语音追加到末尾')};
rec.onresult=event=>{if(voice!==v||v.closed)return;let final='',interim='',fresh=[];for(let i=0;i<event.results.length;i++){const r=event.results[i];if(r.isFinal){final+=r[0].transcript+' ';if(!v.committed.has(i)){fresh.push(r[0].transcript);v.committed.add(i)}}else interim+=r[0].transcript}v.final=final.trim();v.interim=interim;appendVoiceText(box,fresh.join(' '));const live=$('#speechinterim');if(live){live.textContent=interim?'正在识别（尚未确认）：'+interim:'';live.classList.toggle('hidden',!interim)}};
rec.onerror=event=>{if(voice!==v)return;v.error=true;const messages={'not-allowed':'麦克风或语音服务权限被拒绝，请在浏览器设置中允许访问。','service-not-allowed':'当前浏览器禁止语音服务，请换外部浏览器尝试。','audio-capture':'未找到可用麦克风，请检查设备。','network':'语音服务连接失败，请检查网络或改用系统听写。','no-speech':'没有识别到语音，可重新开始。','aborted':'语音已停止。','language-not-supported':'该识别语言不可用，请切换语言。'};voiceStatus(messages[event.error]||'语音识别失败，请重试或使用系统听写。');closeVoice(v,false)};
rec.onend=()=>{if(voice===v)closeVoice(v,true)};
try{rec.start()}catch(e){voiceStatus('无法启动语音识别，请检查浏览器权限或换外部浏览器。');closeVoice(v,false)}}
function closeVoice(v,normal){if(v.closed)return;v.closed=true;clearTimeout(v.watchdog);if(v.interim)appendVoiceText(v.box,v.interim);if(session&&v.final+v.interim){session.voiceTurns ||= [];session.voiceTurns.push({text:(v.final+' '+v.interim).trim(),seconds:Math.round((Date.now()-v.started)/1000),unconfirmed:!!v.interim})}v.box.readOnly=false;if(voice===v)voice=null;const b=$('#voicebutton');if(b)b.textContent='🎙 继续语音回答';const lang=$('#voicelang');if(lang)lang.disabled=false;const live=$('#speechinterim');if(live)live.classList.add('hidden');if(normal&&!v.error)voiceStatus(v.interim?'转写已保留（含未确认片段），请检查后提交。':'转写完成，手动修改已保留，可以继续打字或说话。')}
function stopVoice(force=false){if(!voice)return;const v=voice;if(force){closeVoice(v,true);try{v.rec.abort()}catch(e){}return}if(v.stopping)return;v.stopping=true;voiceStatus('正在完成最后一段转写，请稍候…');try{v.rec.stop();v.watchdog=setTimeout(()=>{if(voice===v){closeVoice(v,true);try{v.rec.abort()}catch(e){}}},2500)}catch(e){closeVoice(v,true)}}
function expressionMarkup(text){if(!text.trim())return '';const tokens=['嗯','呃','额','那个','然后','就是','其实','怎么说','you know','i mean','basically','um','uh'];const counts=tokens.map(t=>{let pattern=/^[a-z ]+$/.test(t)?new RegExp('\\b'+t+'\\b','gi'):new RegExp(t,'g');return {t,n:(text.match(pattern)||[]).length}}).filter(x=>x.n);const total=counts.reduce((a,x)=>a+x.n,0);const checks=[['结论','结论|首先|我认为|我会先|first|conclusion'],['原因 / 因果','因为|导致|因此|原因|because|due to|therefore'],['数据 / 验证','核对|验证|数据|指标|分析|data|verify|check'],['建议 / 行动','建议|行动|跟进|改进|recommend|action|improve']];return `<details open><summary>表达复盘 · 看清你的说话习惯</summary><div class="row"><span class="tag">${text.length} 个字符</span><span class="tag">${total} 处可能的填充表达</span><span class="tag">${session.voiceTurns?.length||0} 次语音片段</span></div><p>${counts.length?counts.map(x=>`<span class="tag">${esc(x.t)} × ${x.n}</span>`).join(''):'未检出预设口癖词。'}</p><p class="muted">${total>=4?'可试着用短暂停顿替代连续的“嗯、然后、就是”，先给一句结论，再按两到三个原因展开。':'练习建议：先用一句话给结论，再说原因、验证方法和行动。'}</p>${checks.map(([label,pattern])=>`<div class="check">${new RegExp(pattern,'i').test(text)?'✓':'○'} ${label} <span class="caption">· ${new RegExp(pattern,'i').test(text)?'检出相关表达':'可检查是否讲清楚'}</span></div>`).join('')}<p class="caption">这是文本启发式提示，不是语言逻辑评判。“然后”等词可能是必要连接词；转写也可能自动去掉口癖，未检出不代表没有。暂不分析语气、停顿、音量或发音。</p>${session.voiceTurns?.length?`<details><summary>查看未手动润色的语音转写</summary>${session.voiceTurns.map(v=>`<p class="caption">约 ${v.seconds} 秒 ${v.unconfirmed?'· 包含未确认片段':''}</p><p style="white-space:pre-wrap">${esc(v.text)}</p>`).join('')}</details>`:''}</details>`}

document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{if(session&&!session.active)session=null;nav(b.dataset.view)}));nav('home');
</script></body></html>
